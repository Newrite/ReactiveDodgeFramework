; Reactive Dodge Framework (Skyrim SE 1.5.97)
; Times are seconds, speeds are units/second, angles are degrees. Keys are scan codes
; (decimal or 0x hex); -1 = unbound. Delete a line to get its default.

[Input]
; Keyboard dodge key. 47 (0x2F) = V. Left Alt (56) is the game's Sprint key. Mouse buttons are 0..7, gamepad uses the XInput mask
; (0x80 = right stick click, 0x2000 = B, 0x100 = LB ...). Attack/block buttons are taken from the
; game's own "Right/Left Attack/Block" bindings.
iDodgeKeyboard=0x2F
iDodgeMouse=-1
iDodgeGamepad=0x80
; A press is remembered this long waiting for its window to open.
fBufferWindow=0.20
; Presses of the same button closer together than this count as one.
fDebounce=0.06
; Holding attack this long turns the buffered attack into a power attack.
fPowerAttackHold=0.30
; Separate power-attack buttons of attack frameworks: pressed during a dodge, they cancel it into a power attack
; (the vanilla power-attack action). SKSE key codes, comma separated: keyboard scan code, 256 + mouse button,
; 266 + gamepad button. bReadBFCOPowerKey also takes BFCO's own key (and its modifier) from its MCM settings
; (MCM\Settings\SCSI-ACTbfco-Main.ini, iKeyAttackPowerNUM), read again whenever the journal (MCM) closes.
sPowerAttackKeys=
bReadBFCOPowerKey=1

[Timing]
; Phases of one dodge. Total = Startup + Active + Recovery.
fStartup=0.08
fActive=0.30
fRecovery=0.32
; Blend-out length when the dodge is cancelled into walking/running.
fExitBlend=0.25
; Cancelled into an attack or block, the dodge's momentum runs out over this long instead of stopping dead.
fActionExitBlend=0.15
; Earliest time since the dodge began at which each follow-up may cancel it.
fAttackFrom=0.30
fChainFrom=0.34
fBlockFrom=0.30
fExitFrom=0.34
; Dodges in a row (0 = unlimited).
iMaxChain=3
; Attack states from which a dodge may cancel an attack (None is always allowed). Names:
; Draw, Swing, Hit, NextAttack, FollowThrough, Bash, BowDraw, BowAttached, BowDrawn,
; BowReleasing, BowReleased, BowNextAttack, BowFollowThrough, Fire, Firing, Fired
sAttackStates=NextAttack,FollowThrough,BowDrawn,BowReleased,BowFollowThrough

[Motion]
; Distance covered by an uncancelled dodge.
fDistance=300
; Speed the dodge hands over to when movement input is held at the end.
fRunSpeed=300
; Cap on the running speed carried into a dodge.
fMaxCarrySpeed=450
; After a dodge hands over into running, the game re-accelerates from below the dodge's exit
; speed. Its speed is held at least at the exit speed, decaying by this much per second (u/s^2);
; 0 turns this off (needs a restart).
fCarryDecay=1200
; No direction held: 1 = step backwards, 0 = roll forwards.
bBackstepWithoutInput=1
; Sign applied to the yaw delta written into the engine's root-motion output. Flip to -1 if the
; character turns the wrong way (check the "trace" lines with bDevLog=1).
iYawSign=1

[Steering]
; Maximum turn rate of the dodge path per phase, scaled by stick strength.
fRateStartup=900
fRateActive=260
fRateRecovery=600
; Stick magnitude below this is ignored (the path keeps its heading).
fDeadzone=0.2
; Stick strength = ((magnitude - deadzone) / (1 - deadzone)) ^ exponent.
fResponseExponent=1.0
; How fast the character turns to face its path (deg/s); the startup rate is a near-instant snap.
fStartupYawRate=3600
fFaceYawRate=720
; Auto with TDM 360 movement: a dodge further than this from the facing (deg) does not turn the
; character around; it keeps facing and plays the backward/diagonal-back clip instead.
fFaceMotionMaxAngle=100
; How much the move input may change a dodge once it has started.
;   fMaxDeviation: degrees the path may bend away from its start direction. 180 = anywhere,
;     0 = the start direction is final (no steering at all), 30-45 = small corrections only.
;   fInputCone: input pointing farther than this from the current path is ignored, so pressing the
;     opposite direction does nothing. 180 = all input counts; 90 = only sideways-forward input steers.
fMaxDeviation=180
fInputCone=180
; Read the move input against the camera direction the dodge started with: turning the camera
; mid-dodge no longer steers it (a locked target still does).
bInputFromStartCamera=0
; Dodges that keep facing (no lock-on, camera owns the facing: vanilla camera, TDM Vanilla style):
; 1 = the character holds the direction it faced at the start, instead of the camera turning it
; (the 180-degree turn mid-dodge). A locked target and first person still own the facing.
bHoldFacing=0
; The first seconds of a dodge in which the live move input still re-aims it outright (a press made
; a frame before the keys / stick arrived still goes where you meant). 0 = the press direction is final.
fDirectionCommitTime=0.06
; Directional clips (lock-on, camera-facing dodges) come in 45-degree steps. The body turns by the
; rest of the angle, at most this many degrees, so the clip runs along the real path, and turns back
; during the recovery. 0 = off (the clip is up to 22.5 degrees off the path). Not in first person.
fOrientationWarpMax=22.5
; Auto = keep facing while locked on, otherwise turn to the path. Or FaceMotion / KeepFacing.
sOrientation=Auto

[Cost]
; What a dodge costs: Stamina, Magicka or None (free).
sResource=Stamina
fCost=20
; A dodge is refused when the resource is below this (0 = never refused, it just drains to 0).
fMinimum=10

[Graph]
; Events sent to the behavior graph.
sEventStart=RDF_DodgeStart
sEventStartB=RDF_DodgeStartB
sEventChain=RDF_DodgeChain
sEventExit=RDF_DodgeExit
; Events the graph reports back.
sEventEntered=RDF_DodgeEntered
sEventLeft=RDF_DodgeLeft
; Variables: clip (0..7 roll F FR R BR B BL L FL, 8..15 sidestep, 16 / 17 neutral roll / step: a dodge pressed
; without move input) and playback speed are written
; before the start event; RDF_IsDodging is set by the graph and only read.
sVarClip=RDF_DodgeClip
sVarSpeed=RDF_DodgeSpeed
sVarArmBlend=RDF_ArmBlend
sVarIsDodging=RDF_IsDodging
; Which dodge of a chain is playing: 0 the first, 1 the second, ... Written before the start / chain event,
; back to 0 once the dodge (and its chain) is over. For behaviors that swap clips or branch on the chain.
sVarChainIndex=RDF_ChainIndex
; Length in seconds of the dodge clip at speed 1. RDF_DodgeSpeed is set to
; fAnimSpeed * fClipLength / (fStartup + fActive + fRecovery) so the clip ends with the recovery.
fClipLength=0.667
fAnimSpeed=1.0
; Share (0..1) of the current weapon stance kept on the arms during a dodge, layered over the clip.
; Steps (side/back steps) keep the guard; rolls let the clip move the arms.
fArmStanceStep=1.0
fArmStanceRoll=0.0
; First person plays Bethesda's 1P dodge clips (left / right / back, forward = the 1P sneak roll) on the
; torso, head and camera. Share of the weapon-ready pose on the arms: 1 = the grip stays on the weapon,
; 0 = the arms follow the clip (a one-handed pose; looks wrong with two-handers, bows and staves).
fArmStanceFirstPerson=1.0
; Seconds of those clips at speed 1; the plugin scales playback so the clip spans the dodge.
fClipLengthFirstPerson=0.9
; While a dodge drives the motion the engine skips its own mouse turn, so in first person the plugin
; applies it (the engine's rate: rotateInPlaceRun of the movement type). 1 = same as normal looking,
; 0 = the view's yaw is locked during a 1P dodge, -1 = flip if it turns the wrong way.
fFirstPersonLookScale=1.0
; 1 = keep the stance on the arms even with the weapon / spell sheathed (it is the stance of what is
; equipped, so a sheathed greatsword or spell pulls the hands into its ready pose). 0 = only while drawn.
bArmStanceWhenSheathed=0
; While keeping facing (lock-on) pick sidestep clips (8..15) instead of rolls.
bSidestepWhenKeepFacing=1
; Frames to wait for RDF_DodgeEntered after an accepted start before rolling the dodge back.
iEnterTimeoutFrames=6
; Animation events (comma separated) that open/close a window letting a dodge cancel an attack.
sDodgeWindowOpenEvents=MCO_DodgeOpen
sDodgeWindowCloseEvents=MCO_DodgeClose

[IFrames]
bIFrames=1
; Every projectile type passes through the player during the i-frame window: arrows, bolts, spell
; missiles and grenades fly on (and, once through, never hit the player late); beams, flame streams,
; cones and barriers skip the player only while the i-frames last. Needs a restart.
bProjectileIFrames=1
; Explosions (fireball blasts, traps, runes...) skip the player while the i-frames last: no damage,
; no spell effect, no knockdown. Needs a restart.
bExplosionIFrames=1
fIFrameStart=0.05
fIFrameEnd=0.35

[Perfect]
; A hit the i-frames dodge inside [fPerfectWindowStart, fPerfectWindowEnd] (seconds from the dodge start,
; melee, projectiles and explosions alike) is a perfect dodge, once per dodge. Only counts where the
; i-frames are active (see [IFrames]). It sends a graph event to the player and to the attacker, and an
; SKSE mod event Papyrus can listen to: RegisterForModEvent("RDF_PerfectDodge", ...), with the attacker as
; the sender and the dodge time as numArg.
; A clip with its own RDF_PerfectStart / RDF_PerfectEnd annotations uses those instead of the window below.
bPerfectDodge=1
fPerfectWindowStart=0.0
fPerfectWindowEnd=0.15
; Slow motion on the player's perfect dodge, through the engine's own magic slowdown (the one the Slow Time
; shout uses): the world runs at fPerfectSlowMotion (1 = no slow motion), the player at
; fPerfectSlowMotionPlayer (1 = full speed while the world is slow; equal to fPerfectSlowMotion = slowed alike).
; Real seconds: eased in over fPerfectSlowMotionEaseIn, held fPerfectSlowMotionDuration, eased out over
; fPerfectSlowMotionEaseOut. A perfect dodge during it holds it again; fPerfectSlowMotionCooldown is the wait
; after one ends before the next can start. Skipped while the Slow Time shout or a kill cam runs.
fPerfectSlowMotion=1.0
fPerfectSlowMotionPlayer=1.0
fPerfectSlowMotionDuration=0.4
fPerfectSlowMotionEaseIn=0.05
fPerfectSlowMotionEaseOut=0.2
fPerfectSlowMotionCooldown=0.0
sPlayerEvent=RDF_PerfectDodge
sAttackerEvent=RDF_PerfectDodged
sModEvent=RDF_PerfectDodge

[AttackCancel]
; When a dodge may cancel the actor's own attack. In order, the first rule that applies decides:
; 1. no attack (vanilla attack state None): yes;
; 2. the actor has sAnyTimeKeyword (normal attacks) / sAnyTimePowerKeyword (power attacks) on itself, its race,
;    a worn item or an active magic effect: yes, at any moment. A keyword is "Plugin.esp|0xFormID" or an EditorID;
;    empty = none. Both keywords are needed to cancel both kinds;
; 3. the attack clip carries RDF_DodgeCancelOpen / RDF_DodgeCancelClose annotations: only inside its open windows
;    (they replace the rules below; a Close at 0.0 makes the clip decide from its first frame);
; 4. a dodge window event ([Graph] sDodgeWindowOpenEvents);
; 5. bDodgeInRecovery and the attack reached its recovery: an event of sRecoveryEvents opened it (until one of
;    sRecoveryEndEvents or the next attack), or a bool graph variable of sRecoveryVariables is true
;    (MCO: MCO_Recovery / MCO_IsInRecovery, ended by MCO_InputBuffer; BFCO: BFCO_DIY_recovery, ended by
;    the next attack's Bfco_AttackStartFX);
; 6. the vanilla attack state is one of [Timing] sAttackStates.
; A new attack (the vanilla state passing through Draw, or one of sAttackStartEvents) starts its windows over.
bDodgeInRecovery=1
sRecoveryEvents=MCO_Recovery,BFCO_DIY_recovery
sRecoveryEndEvents=MCO_InputBuffer,Bfco_AttackStartFX
sRecoveryVariables=MCO_IsInRecovery
sAttackStartEvents=MCO_AttackInitiate,MCO_PowerAttackInitiate,Bfco_AttackStartFX
sAnyTimeKeyword=
sAnyTimePowerKeyword=

[Compat]
; First person: the rdf patch has first-person dodge states (vanilla 1P dodge clips blended with the
; weapon stance, see fArmStanceFirstPerson); the camera keeps its direction.
bAllowFirstPerson=1
; STB.dll has its own Left Alt dodge driven by The Ultimate Dodge Mod's globals. With this on, the
; globals UDDodgeKey and UDSprintDodge are set to 0 on every load/new game so only this plugin
; reacts. The values persist in the save; to restore them use the console:
;   set UDDodgeKey to 56
;   set UDSprintDodge to 1
bSuppressLegacyDodge=1
; Use True Directional Movement's target lock as the lock-on direction when it is installed.
bUseTrueDirectionalMovement=1
; With Precision installed, i-frames also register Precision's pre-hit callback, so its hits are ignored
; before its hitstop / impact effects play (otherwise only the damage is dropped).
bUsePrecision=1

[Dev]
; Structured diagnostics in ReactiveDodgeFramework.log: decisions, rejections, graph events and a
; per-tick trace (requested vs actual displacement, heading error, hook thread ids).
bDevLog=0

[Jump]
; 1 = the jump button does nothing during a dodge until its exit window opens (the same point from
; which running may take over). 0 = a jump may cut any dodge short.
bBlockDuringDodge=1

[Stagger]
; 1 = a dodge may cut a stagger short (the press is otherwise refused while staggered).
bDodgeFromStagger=0
; Seconds the stagger must have lasted before such a dodge is allowed.
fDodgeDelay=0.0
