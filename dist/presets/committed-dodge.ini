; Preset "Committed Dodge": once a dodge has started, neither the move input nor the camera changes it.
; Only these keys differ from dist/ReactiveDodgeFramework.ini. The plugin reads a single ini, so a preset
; mod ships a full copy of the user's ini with these values (MO2: "AI - RDF Preset - Committed Dodge").
; The direction is still taken from the input during the first fDirectionCommitTime seconds.
[Steering]
fMaxDeviation=0
bInputFromStartCamera=1
bHoldFacing=1
